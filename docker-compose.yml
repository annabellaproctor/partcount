services:
  app:
    build: .
    container_name: labinv_app
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    # --proxy-headers makes uvicorn trust Traefik's X-Forwarded-Proto. Without
    # it every redirect (e.g. /api/manufacturers -> /api/manufacturers/) is built
    # as http://, and the browser blocks it as mixed content on an https page.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8437 --reload --proxy-headers --forwarded-allow-ips="*"
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - labinv_images:/app/images

volumes:
  labinv_images:
