services:
  app:
    build: .
    container_name: labinv_app
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8437 --reload
    volumes:
      - ./app:/app/app
      - ./templates:/app/templates
      - labinv_images:/app/images

volumes:
  labinv_images:
