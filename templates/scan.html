{% extends "base.html" %}
{% block title %}Scan :: LAB INV{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card mb-3">
      <div class="card-header">BARCODE SCANNER INPUT</div>
      <div class="p-4 text-center">
        <div style="font-size:11px;color:var(--text-dim);margin-bottom:16px;">
          HID scanner: point and scan. Manual: type ID below.
        </div>
        <input id="manual-input" class="form-control text-center" style="font-size:18px;letter-spacing:4px;"
               placeholder="R001" autocomplete="off" autofocus>
        <button class="btn btn-primary mt-2" onclick="manualScan()">LOOKUP</button>
      </div>
    </div>

    <div class="card" id="result-card" style="display:none;">
      <div class="card-header">RESULT</div>
      <div class="p-3" id="result-body"></div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function manualScan() {
  const id = document.getElementById('manual-input').value.trim().toUpperCase();
  if (!id) return;
  const res = await fetch('/api/components/' + id + '/scan', {method:'POST'});
  const card = document.getElementById('result-card');
  const body = document.getElementById('result-body');
  if (res.ok) {
    const data = await res.json();
    card.style.display = '';
    body.innerHTML = `
      <div class="row">
        <div class="col">
          <div style="font-size:22px;color:var(--green);font-weight:bold;">${data.barcode_id}</div>
          <div style="font-size:16px;">${data.name}</div>
          <div style="color:var(--text-dim);font-size:12px;">Box: ${data.box} · Cell: ${data.cell}</div>
        </div>
      </div>`;
  } else {
    card.style.display = '';
    body.innerHTML = `<div style="color:var(--red);">NOT FOUND: ${id}</div>`;
  }
  document.getElementById('manual-input').value = '';
  document.getElementById('manual-input').focus();
}

document.getElementById('manual-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') manualScan();
});

document.addEventListener('inv:scan', (e) => {
  document.getElementById('result-card').style.display = '';
  document.getElementById('result-body').innerHTML = `
    <div style="font-size:22px;color:var(--green);font-weight:bold;">${e.detail.barcode_id}</div>
    <div style="font-size:16px;">${e.detail.name}</div>
    <div style="color:var(--text-dim);font-size:12px;">Box: ${e.detail.box} · Cell: ${e.detail.cell}</div>`;
});
</script>
{% endblock %}
