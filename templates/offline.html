<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3ddc84">
  <title>LAB::INV - Offline</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #0a0a0a;
      color: #e8e8e8;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 16px 0;
      color: #3ddc84;
    }
    p {
      font-size: 14px;
      color: #a0a0a0;
      margin: 0 0 24px 0;
      line-height: 1.6;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    a {
      color: #3ddc84;
      text-decoration: none;
      font-size: 12px;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>LAB::INV Offline</h1>
    <p>You're currently offline. Some features may be limited. Please check your internet connection.</p>
    <p><a href="/">← Back</a></p>
  </div>
</body>
</html>
