<!-- Global Add Popup -->
<div id="add-popup" class="add-popup-overlay" style="display:none;" onclick="if(event.target===this)closeAddPopup()">
  <div class="add-popup-panel">

    <!-- Header -->
    <div class="add-popup-header">
      <span style="letter-spacing:1.5px;text-transform:uppercase;font-size:11px;color:var(--text2);">Add Component</span>
      <div style="display:flex;gap:8px;align-items:center;margin-left:auto;">
        <a href="/add" target="_blank" style="font-size:10px;color:var(--text3);">↗ Full page</a>
        <button onclick="closeAddPopup()" style="background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:0 4px;">✕</button>
      </div>
    </div>

    <!-- Section 1: DigiKey/Mouser search -->
    <div class="add-popup-section">
      <div style="font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;">Search Suppliers</div>
      <div style="display:flex;gap:6px;">
        <input id="lookup-input" class="form-control" placeholder="MPN, name, value... e.g. ESP32-WROOM, 10k 0805"
               oninput="debounceLookup(this.value)"
               onkeydown="if(event.key==='Enter'){event.preventDefault();runLookup(this.value,event.shiftKey);}"
               autocomplete="off" style="flex:1;">
        <select id="lookup-source" class="form-select" style="width:110px;">
          <option value="auto">Auto</option>
          <option value="digikey">DigiKey</option>
        </select>
      </div>
      <div id="lookup-results" style="display:none;margin-top:4px;border:1px solid var(--border);border-radius:2px;max-height:220px;overflow-y:auto;background:var(--bg2);"></div>
    </div>

    <!-- Section 2: AI Paste — always visible -->
    <div class="add-popup-section" style="border-top:1px solid var(--border);">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
        <span style="font-size:10px;color:var(--text3);letter-spacing:1px;text-transform:uppercase;">AI Parse — paste any text</span>
        <button type="button" onclick="runAIParse()" id="ai-parse-btn" class="btn btn-primary btn-xs" style="margin-left:auto;">⚡ Parse</button>
      </div>
      <textarea id="ai-paste-input" class="form-control" rows="2"
        style="font-size:11px;resize:vertical;font-family:var(--font);"
        placeholder="Paste Amazon listing · datasheet text · product description · part number · anything..."></textarea>
      <div id="ai-parse-status" style="font-size:10px;color:var(--text3);margin-top:3px;min-height:14px;"></div>
    </div>

    <!-- Section 3: Selected result preview -->
    <div id="lookup-preview" style="display:none;" class="add-popup-preview">
      <div style="display:flex;gap:10px;align-items:flex-start;">
        <div style="width:56px;height:56px;background:var(--bg3);border-radius:2px;flex-shrink:0;overflow:hidden;">
          <img id="preview-img" style="width:100%;height:100%;object-fit:contain;" src="" onerror="this.parentElement.style.display='none'">
        </div>
        <div style="flex:1;min-width:0;">
          <div id="preview-name" style="font-size:13px;color:var(--text);font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"></div>
          <div id="preview-mpn"  style="font-size:10px;color:var(--text3);margin:2px 0;"></div>
          <div id="preview-desc" style="font-size:11px;color:var(--text2);max-height:36px;overflow:hidden;"></div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <div id="preview-price"  style="font-size:13px;color:var(--amber);"></div>
          <div id="preview-source" style="font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-top:2px;"></div>
          <button onclick="clearPreview()" class="btn btn-danger btn-xs" style="margin-top:6px;">Clear</button>
        </div>
      </div>
    </div>

    <!-- Form -->
    <form id="add-comp-form" onsubmit="submitAddForm(event)">
      <div class="add-popup-form">
        <div class="row g-2">

          <div class="col-6">
            <label class="form-label">Name *</label>
            <input name="name" id="f-name" class="form-control" required placeholder="ESP32-WROOM-32E">
          </div>
          <div class="col-6">
            <label class="form-label">Type *</label>
            <select name="type_id" id="f-type" class="form-select" required>
              <option value="">— select —</option>
            </select>
          </div>

          <div class="col-4">
            <label class="form-label">Value</label>
            <input name="value" id="f-value" class="form-control" placeholder="10k">
          </div>
          <div class="col-4">
            <label class="form-label">Unit</label>
            <div style="display:flex;gap:4px;">
              <select id="f-unit-sel" class="form-select" style="flex:1;">
                <option value="">—</option>
                <option value="Ω">Ω</option>
                <option value="F">F</option>
                <option value="H">H</option>
                <option value="V">V</option>
                <option value="A">A</option>
                <option value="W">W</option>
                <option value="Hz">Hz</option>
                <option value="ppm">ppm</option>
                <option value="custom">Custom…</option>
              </select>
              <input name="unit" id="f-unit" class="form-control" placeholder="unit" style="width:60px;display:none;">
            </div>
          </div>
          <div class="col-4">
            <label class="form-label">Package</label>
            <input name="package" id="f-package" class="form-control" list="pkg-list" placeholder="0805">
            <datalist id="pkg-list">
              <option value="0201"><option value="0402"><option value="0603"><option value="0805">
              <option value="1206"><option value="1210"><option value="SOT-23"><option value="SOT-23-5">
              <option value="TO-92"><option value="TO-220"><option value="DIP-8"><option value="DIP-14">
              <option value="DIP-16"><option value="SOIC-8"><option value="QFN-32"><option value="LQFP-64">
              <option value="Through-hole"><option value="Module">
            </datalist>
          </div>

          <div class="col-4">
            <label class="form-label">Tolerance</label>
            <input name="tolerance" id="f-tolerance" class="form-control" list="tol-list" placeholder="1%">
            <datalist id="tol-list">
              <option value="0.1%"><option value="0.5%"><option value="1%">
              <option value="2%"><option value="5%"><option value="10%">
            </datalist>
          </div>
          <div class="col-4">
            <label class="form-label">Voltage Rating</label>
            <input name="voltage_rating" id="f-voltage" type="number" step="0.1" class="form-control" placeholder="50">
          </div>
          <div class="col-4">
            <label class="form-label">Manufacturer</label>
            <input name="manufacturer_name" id="f-mfr" class="form-control" list="mfr-list" placeholder="Espressif">
            <datalist id="mfr-list"></datalist>
          </div>

          <div class="col-6">
            <label class="form-label">MPN</label>
            <input name="mpn" id="f-mpn" class="form-control" placeholder="Manufacturer Part Number">
          </div>
          <div class="col-6">
            <label class="form-label">DigiKey PN</label>
            <input name="digikey_pn" id="f-dkpn" class="form-control" placeholder="Optional">
          </div>

          <div class="col-12">
            <label class="form-label">Datasheet URL</label>
            <input name="datasheet_url" id="f-datasheet" class="form-control" placeholder="https://...">
          </div>

          <div class="col-12">
            <label class="form-label">Notes</label>
            <input name="notes" id="f-notes" class="form-control" placeholder="Optional">
          </div>

          <input type="hidden" name="lcsc_pn"   id="f-lcsc">
          <input type="hidden" name="image_url"  id="f-imgurl">
          <input type="hidden" name="description" id="f-desc">
        </div>
      </div>

      <div class="add-popup-footer">
        <span id="add-form-status" style="font-size:11px;color:var(--text3);flex:1;"></span>
        <div style="display:flex;gap:8px;">
          <button type="button" onclick="resetAddForm()" class="btn btn-danger btn-sm">Reset</button>
          <button type="button" onclick="addAnother()" id="add-another-btn" class="btn btn-primary btn-sm">+ Add Another</button>
          <button type="submit" id="add-submit-btn" class="btn btn-primary btn-sm">Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<style>
.add-popup-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 500;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.add-popup-panel {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 3px;
  width: 100%; max-width: 660px;
  max-height: 92vh;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.add-popup-header {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.add-popup-section {
  padding: 10px 14px;
  flex-shrink: 0;
}
.add-popup-preview {
  padding: 10px 14px;
  border-top: 1px solid var(--border);
  background: var(--bg3);
  flex-shrink: 0;
}
.add-popup-form {
  padding: 12px 14px;
  overflow-y: auto;
  flex: 1;
}
.add-popup-footer {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  background: var(--bg3);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
.lookup-result-item {
  padding: 6px 10px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  display: flex; gap: 8px; align-items: center;
  font-size: 12px;
  transition: background 0.1s;
}
.lookup-result-item:hover { background: var(--bg4); }
.lookup-result-item:last-child { border-bottom: none; }
.lr-source {
  font-size: 9px; padding: 1px 5px; border-radius: 2px;
  text-transform: uppercase; letter-spacing: 0.5px; display: inline-block;
}
.lr-dk { background: rgba(255,100,0,0.15); color: #ff6400; border: 1px solid rgba(255,100,0,0.3); }
.lr-lc { background: rgba(0,180,100,0.15); color: #00b464; border: 1px solid rgba(0,180,100,0.3); }
.lr-ai { background: rgba(138,100,255,0.15); color: #8a64ff; border: 1px solid rgba(138,100,255,0.3); }
</style>
