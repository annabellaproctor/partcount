<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LAB::INV{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      --bg:       #0a0a0a;
      --bg2:      #111111;
      --bg3:      #181818;
      --bg4:      #1e1e1e;
      --border:   #242424;
      --border2:  #2e2e2e;
      --green:    #3ddc84;
      --green2:   #2ab56d;
      --green-bg: rgba(61,220,132,0.06);
      --amber:    #f0a500;
      --red:      #e05555;
      --blue:     #4a9eff;
      --text:     #d4d4d4;
      --text2:    #888;
      --text3:    #555;
      --font:     'Courier New', Courier, monospace;
      --radius:   3px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg) !important;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    a { color: var(--green2); text-decoration: none; }
    a:hover { color: var(--green); }
    ::selection { background: rgba(61,220,132,0.2); }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* ── topbar ── */
    .topbar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 42px;
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar .brand {
      color: var(--green);
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 3px;
      margin-right: 24px;
      white-space: nowrap;
    }
    .topbar .brand span { color: var(--text3); }
    .nav-link {
      color: var(--text3);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 0 12px;
      height: 42px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .nav-link:hover { color: var(--text); border-bottom-color: var(--border2); }
    .nav-link.active { color: var(--green); border-bottom-color: var(--green); }
    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ws-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text3);
      transition: background 0.3s;
    }
    .ws-dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .profile-badge {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--bg4);
      border: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: var(--green);
      letter-spacing: 0.5px;
      cursor: default;
      user-select: none;
    }

    /* ── main ── */
    .main {
      padding: 20px 20px 140px;
      flex: 1;
    }

    /* ── cards ── */
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .card-header {
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
      padding: 7px 14px;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-header .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
    }

    /* ── tables ── */
    .table { color: var(--text); font-size: 12px; margin: 0; }
    .table th {
      color: var(--text3);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-color: var(--border);
      background: var(--bg3);
      font-weight: normal;
      padding: 6px 12px;
    }
    .table td { border-color: var(--border); vertical-align: middle; padding: 6px 12px; }
    .table tbody tr:hover { background: var(--bg3); }

    /* ── badges ── */
    .bid {
      display: inline-block;
      background: rgba(61,220,132,0.08);
      color: var(--green);
      border: 1px solid rgba(61,220,132,0.2);
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 2px;
      font-family: var(--font);
      letter-spacing: 0.5px;
    }
    .status-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 2px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .status-active   { background: rgba(61,220,132,0.1);  color: var(--green);  border: 1px solid rgba(61,220,132,0.2); }
    .status-paused   { background: rgba(240,165,0,0.1);   color: var(--amber);  border: 1px solid rgba(240,165,0,0.2); }
    .status-complete { background: rgba(74,158,255,0.1);  color: var(--blue);   border: 1px solid rgba(74,158,255,0.2); }

    /* ── forms ── */
    .form-control, .form-select {
      background: var(--bg3);
      border: 1px solid var(--border2);
      color: var(--text);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 12px;
      padding: 5px 10px;
    }
    .form-control:focus, .form-select:focus {
      background: var(--bg4);
      border-color: var(--green2);
      color: var(--text);
      box-shadow: 0 0 0 2px rgba(61,220,132,0.08);
    }
    .form-control::placeholder { color: var(--text3); }
    .form-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text2); margin-bottom: 4px; }

    /* ── buttons ── */
    .btn { font-family: var(--font); border-radius: var(--radius); font-size: 11px; letter-spacing: 0.5px; }
    .btn-primary {
      background: transparent;
      border: 1px solid var(--green2);
      color: var(--green);
    }
    .btn-primary:hover { background: var(--green-bg); border-color: var(--green); color: var(--green); }
    .btn-danger { background: transparent; border: 1px solid #5a2525; color: var(--red); }
    .btn-danger:hover { background: rgba(224,85,85,0.08); border-color: var(--red); color: var(--red); }
    .btn-sm { padding: 2px 9px; font-size: 10px; }
    .btn-xs { padding: 1px 6px; font-size: 9px; }

    /* ── stats ── */
    .stat-grid { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat {
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: var(--radius);
      min-width: 110px;
    }
    .stat .s-label { font-size: 9px; color: var(--text3); letter-spacing: 1.5px; text-transform: uppercase; }
    .stat .s-value { font-size: 26px; color: var(--green); font-weight: bold; line-height: 1.2; }
    .stat .s-sub { font-size: 10px; color: var(--text3); }

    /* ── box minimap ── */
    .box-map {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .box-tile {
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 2px;
      padding: 5px 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      text-decoration: none;
    }
    .box-tile:hover { border-color: var(--green2); background: var(--bg4); }
    .box-tile .bt-label { font-size: 10px; color: var(--green); font-weight: bold; }
    .box-tile .bt-model { font-size: 9px; color: var(--text3); }
    .box-tile .bt-bar {
      margin-top: 4px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .box-tile .bt-fill { height: 100%; background: var(--green2); border-radius: 2px; transition: width 0.3s; }
    .box-144 { width: 72px; }
    .box-96  { width: 58px; }
    .box-48  { width: 44px; }
    .box-24  { width: 32px; }

    /* ── event log ── */
    .eventlog-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 6px 16px 8px;
      z-index: 200;
    }
    .eventlog-label {
      font-size: 9px; color: var(--text3);
      letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 4px;
    }
    #event-log {
      height: 58px;
      overflow-y: auto;
      display: flex;
      flex-direction: column-reverse;
    }
    .log-line { font-size: 11px; color: var(--text3); line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .log-line .ts { color: var(--text3); margin-right: 10px; }
    .log-line.scan   { color: var(--green); }
    .log-line.stock  { color: var(--amber); }
    .log-line.error  { color: var(--red); }
    .log-line.info   { color: var(--blue); }

    /* ── todo ── */
    .todo-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
    .todo-item:last-child { border-bottom: none; }
    .todo-item.done .todo-text { text-decoration: line-through; color: var(--text3); }
    .priority-2 { border-left: 2px solid var(--red); padding-left: 6px; }
    .priority-1 { border-left: 2px solid var(--amber); padding-left: 6px; }

    /* ── misc ── */
    .sep { color: var(--text3); margin: 0 4px; }
    .muted { color: var(--text3); }
    .page-title { font-size: 13px; color: var(--text2); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="brand">LAB<span>::</span>INV</div>
  <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
  <a href="/components" class="nav-link {% if '/components' in request.url.path %}active{% endif %}">Components</a>
  <a href="/boxes" class="nav-link {% if '/boxes' in request.url.path %}active{% endif %}">Boxes</a>
  <a href="/projects" class="nav-link {% if '/projects' in request.url.path %}active{% endif %}">Projects</a>
  <a href="/scan" class="nav-link {% if '/scan' in request.url.path %}active{% endif %}">Scan</a>
  <a href="/settings" class="nav-link {% if '/settings' in request.url.path %}active{% endif %}">Settings</a>
  <div class="topbar-right">
    <button onclick="openAddPopup()" class="btn btn-primary btn-sm" style="font-size:11px;padding:3px 10px;letter-spacing:1px;" title="Add component (A)">+ ADD</button>
    <div class="ws-dot" id="ws-dot" title="WebSocket"></div>
    <div class="profile-badge" title="{{ profile.name if profile else 'AP' }}">
      {{ profile.initials if profile else 'AP' }}
    </div>
  </div>
</div>

<div class="main">
  {% block content %}{% endblock %}
</div>

<div class="eventlog-bar">
  <div class="eventlog-label">event log</div>
  <div id="event-log"></div>
</div>

<script>
const log = document.getElementById('event-log');
const wsDot = document.getElementById('ws-dot');

function addLog(msg, cls='') {
  const ts = new Date().toTimeString().slice(0,8);
  const line = document.createElement('div');
  line.className = `log-line ${cls}`;
  line.innerHTML = `<span class="ts">${ts}</span>${msg}`;
  log.prepend(line);
  if (log.children.length > 80) log.removeChild(log.lastChild);
}

const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${wsProto}://${location.host}/ws`);
ws.onopen = () => { wsDot.classList.add('on'); addLog('ws connected', 'info'); };
ws.onclose = () => { wsDot.classList.remove('on'); addLog('ws disconnected', 'error'); };
ws.onmessage = (e) => {
  const msg = JSON.parse(e.data);
  if (msg.event === 'scan') {
    addLog(`SCAN ${msg.data.barcode_id} → ${msg.data.name} [${msg.data.box}:${msg.data.cell}]`, 'scan');
    document.dispatchEvent(new CustomEvent('inv:scan', {detail: msg.data}));
  } else if (msg.event === 'stock_change') {
    const s = msg.data.delta > 0 ? '+' : '';
    addLog(`STOCK ${msg.data.barcode_id} ${s}${msg.data.delta} → qty ${msg.data.quantity}`, 'stock');
  } else if (msg.event === 'component_created') {
    addLog(`NEW ${msg.data.barcode_id} ${msg.data.name}`, 'info');
  } else if (msg.event === 'project_created') {
    addLog(`PROJECT ${msg.data.name}`, 'info');
  }
};

// HID scanner global buffer
let buf = '', bufTimer;
document.addEventListener('keydown', (e) => {
  if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
  if (e.key === 'Enter' && buf.length > 2) {
    fetch('/api/components/' + buf.toUpperCase() + '/scan', {method:'POST'});
    buf = '';
  } else if (e.key.length === 1) {
    buf += e.key;
    clearTimeout(bufTimer);
    bufTimer = setTimeout(() => buf = '', 500);
  }
});
</script>

{% include "add_popup.html" %}

{% block scripts %}{% endblock %}

<script>
// ── Add Popup ──────────────────────────────────────────────────────────────
let _types = [], _manufacturers = [], _formLoaded = false;

async function _loadFormData() {
  if (_formLoaded) return;
  try {
    const [t, m] = await Promise.all([
      fetch('/api/components/types').then(r => r.ok ? r.json() : []),
      fetch('/api/manufacturers').then(r => r.ok ? r.json() : []),
    ]);
    _types = Array.isArray(t) ? t : [];
    _manufacturers = Array.isArray(m) ? m : [];

    const sel = document.getElementById('f-type');
    if (sel && _types.length) {
      _types.forEach(type => {
        if (!sel.querySelector(`option[value="${type.id}"]`)) {
          const opt = document.createElement('option');
          opt.value = type.id;
          opt.textContent = type.name;
          sel.appendChild(opt);
        }
      });
    }
    const dl = document.getElementById('mfr-list');
    if (dl && _manufacturers.length) {
      dl.innerHTML = '';
      _manufacturers.forEach(mfr => {
        const opt = document.createElement('option');
        opt.value = mfr.name;
        dl.appendChild(opt);
      });
    }
    _formLoaded = true;
  } catch(e) {
    console.error('_loadFormData error:', e);
  }
}

function openAddPopup(e) {
  if (e && e.shiftKey) { window.open('/add', '_blank'); return; }
  document.getElementById('add-popup').style.display = 'flex';
  _loadFormData();
  setTimeout(() => { const el = document.getElementById('lookup-input'); if(el) el.focus(); }, 100);
}

function closeAddPopup() {
  document.getElementById('add-popup').style.display = 'none';
}

// wire unit select
document.addEventListener('DOMContentLoaded', () => {
  const sel = document.getElementById('f-unit-sel');
  const inp = document.getElementById('f-unit');
  if (!sel || !inp) return;
  sel.name = 'unit';
  sel.addEventListener('change', () => {
    if (sel.value === 'custom') {
      sel.name = '';
      inp.name = 'unit';
      inp.style.display = '';
      inp.focus();
    } else {
      inp.name = '';
      inp.style.display = 'none';
      sel.name = 'unit';
    }
  });
});

// Lookup
let _lookupTimer;
function debounceLookup(val) {
  clearTimeout(_lookupTimer);
  const res = document.getElementById('lookup-results');
  if (!val || val.length < 2) { if(res) res.style.display='none'; return; }
  _lookupTimer = setTimeout(() => runLookup(val), 450);
}

async function runLookup(q, force) {
  const sourceEl = document.getElementById('lookup-source');
  const source = sourceEl ? sourceEl.value : 'auto';
  const res = document.getElementById('lookup-results');
  if (!res) return;
  res.style.display = 'block';
  res.innerHTML = '<div style="padding:8px;color:var(--text3);font-size:11px;">' + (force ? 'Force refreshing…' : 'Searching…') + '</div>';
  try {
    const url = `/api/lookup/search?q=${encodeURIComponent(q)}&source=${source}` + (force ? '&force=true' : '');
    const data = await fetch(url).then(r=>r.json());
    const results = data.results || [];
    if (!results.length) {
      res.innerHTML = '<div style="padding:8px;color:var(--text3);font-size:11px;">No results — try DigiKey or LCSC directly</div>';
      return;
    }
    // Store results in a map to avoid JSON injection in onclick
    window._lookupResults = {};
    res.innerHTML = results.map((r, i) => {
      window._lookupResults[i] = r;
      const src = r.source || 'unknown';
      const srcCls = src === 'digikey' ? 'lr-dk' : 'lr-lc';
      const name = (r.name || r.mpn || 'Unknown').replace(/</g,'&lt;');
      const mpn = (r.mpn || '').replace(/</g,'&lt;');
      const price = r.unit_price ? '$' + parseFloat(r.unit_price).toFixed(3) : '';
      return '<div class="lookup-result-item" onclick="selectLookupResult(' + i + ')">' +
        '<span class="lr-source ' + srcCls + '">' + src + '</span>' +
        '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + name + '</span>' +
        '<span style="color:var(--text3);font-size:10px;white-space:nowrap;">' + mpn + '</span>' +
        (price ? '<span style="color:var(--amber);font-size:10px;">' + price + '</span>' : '') +
        '</div>';
    }).join('');
  } catch(e) {
    res.innerHTML = '<div style="padding:8px;color:var(--red);font-size:11px;">Lookup error — check console</div>';
    console.error('Lookup error:', e);
  }
}

function selectLookupResult(idx) {
  const r = window._lookupResults[idx] || {};
  if (!r) return;
  const set = (id, val) => { const el = document.getElementById(id); if(el && val) el.value = val; };
  set('f-name', r.name);
  set('f-mpn', r.mpn);
  set('f-dkpn', r.digikey_pn);
  set('f-lcsc', r.lcsc_pn);
  set('f-package', r.package);
  set('f-tolerance', r.tolerance);
  set('f-voltage', r.voltage_rating);
  set('f-datasheet', r.datasheet_url);
  set('f-mfr', r.manufacturer);
  set('f-value', r.value);
  set('f-imgurl', r.image_url);
  set('f-desc', r.description);

  // auto-select type from name heuristics
  if (_types.length && r.name) {
    const nl = r.name.toLowerCase();
    const match = _types.find(t =>
      nl.includes(t.name) || t.name === 'resistor' && nl.includes('resist') ||
      t.name === 'capacitor' && (nl.includes('cap') || nl.includes('ceram')) ||
      t.name === 'diode' && nl.includes('diode') ||
      t.name === 'transistor' && (nl.includes('transistor') || nl.includes('bjt')) ||
      t.name === 'mosfet' && nl.includes('mosfet') ||
      t.name === 'ic' && (nl.includes(' ic') || nl.includes('chip'))
    );
    if (match) {
      const sel = document.getElementById('f-type');
      if (sel) sel.value = match.id;
    }
  }

  const prevName = document.getElementById('preview-name');
  const prevMPN = document.getElementById('preview-mpn');
  const prevDesc = document.getElementById('preview-desc');
  const prevPrice = document.getElementById('preview-price');
  const prevSrc = document.getElementById('preview-source');
  const prevImg = document.getElementById('preview-img');
  const prevBox = document.getElementById('lookup-preview');

  if(prevName) prevName.textContent = r.name || '';
  if(prevMPN) prevMPN.textContent = [r.mpn, r.digikey_pn, r.lcsc_pn].filter(Boolean).join(' · ');
  if(prevDesc) prevDesc.textContent = r.description || '';
  if(prevPrice) prevPrice.textContent = r.unit_price ? `$${parseFloat(r.unit_price).toFixed(4)}` : '';
  if(prevSrc) prevSrc.textContent = r.source || '';
  if(prevImg && r.image_url) { prevImg.src = r.image_url; prevImg.style.display=''; }
  if(prevBox) prevBox.style.display = 'block';

  const res = document.getElementById('lookup-results');
  if(res) res.style.display = 'none';
  const inp = document.getElementById('lookup-input');
  if(inp) inp.value = '';
}

function clearPreview() {
  const p = document.getElementById('lookup-preview');
  if(p) p.style.display='none';
  const i = document.getElementById('f-imgurl');
  if(i) i.value='';
}

async function _doSubmit(keepOpen) {
  const btn = document.getElementById(keepOpen ? 'add-another-btn' : 'add-submit-btn');
  const status = document.getElementById('add-form-status');
  if(btn) { btn.disabled=true; btn.textContent='Saving...'; }
  const fd = new FormData(document.getElementById('add-comp-form'));
  try {
    const r = await fetch('/api/components/', {method:'POST', body: fd});
    const txt = await r.text();
    if (r.ok) {
      const data = JSON.parse(txt);
      if(status) { status.style.color='var(--green)'; status.textContent=`✓ ${data.barcode_id} saved`; }
      resetAddForm();
      if (!keepOpen) closeAddPopup();
      if (window.location.pathname.startsWith('/components')) location.reload();
    } else {
      if(status) { status.style.color='var(--red)'; status.textContent=`Error: ${txt.slice(0,100)}`; }
    }
  } catch(e) {
    if(status) { status.style.color='var(--red)'; status.textContent=`Network error`; }
  }
  if(btn) { btn.disabled=false; btn.textContent = keepOpen ? '+ Add Another' : 'Save'; }
}

function submitAddForm(e) { e.preventDefault(); _doSubmit(false); }
function addAnother() { _doSubmit(true); }

function resetAddForm() {
  const form = document.getElementById('add-comp-form');
  if(form) form.reset();
  clearPreview();
  const res = document.getElementById('lookup-results');
  if(res) res.style.display='none';
}

// keyboard: A = open, Escape = close
document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  if (tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
  if (e.key==='a'||e.key==='A') openAddPopup(e);
  if (e.key==='Escape') closeAddPopup();
});
</script>
</body>
</html>
