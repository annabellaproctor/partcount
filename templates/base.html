<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LAB::INV{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      --bg:       #0a0a0a;
      --bg2:      #111111;
      --bg3:      #181818;
      --bg4:      #1e1e1e;
      --border:   #242424;
      --border2:  #2e2e2e;
      --green:    #3ddc84;
      --green2:   #2ab56d;
      --green-bg: rgba(61,220,132,0.06);
      --amber:    #f0a500;
      --red:      #e05555;
      --blue:     #4a9eff;
      --text:     #e8e8e8;
      --text2:    #a0a0a0;
      --text3:    #686868;
      --font:     'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Courier New', monospace;
      --radius:   3px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg) !important;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    a { color: var(--green2); text-decoration: none; }
    a:hover { color: var(--green); }
    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: 2px;
      box-shadow: 0 0 0 3px rgba(61,220,132,0.15);
    }
    ::selection { background: rgba(61,220,132,0.2); }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* ── topbar ── */
    .topbar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 42px;
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar .brand {
      color: var(--green);
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 3px;
      margin-right: 24px;
      white-space: nowrap;
    }
    .topbar .brand span { color: var(--text3); }
    .nav-link {
      color: var(--text3);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 0 12px;
      height: 42px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .nav-link:hover { color: var(--text); border-bottom-color: var(--border2); }
    .nav-link.active { color: var(--green); border-bottom-color: var(--green); }
    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ws-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text3);
      transition: background 0.3s;
    }
    .ws-dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .profile-badge {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--bg4);
      border: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: var(--green);
      letter-spacing: 0.5px;
      cursor: default;
      user-select: none;
    }

    /* ── main ── */
    .main {
      padding: 20px 20px 140px;
      flex: 1;
    }

    /* ── cards ── */
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .card-header {
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
      padding: 7px 14px;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-header .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
    }

    /* ── tables ── */
    .table { color: var(--text); font-size: 13px; margin: 0; --bs-table-bg: var(--bg2); --bs-table-striped-bg: var(--bg2); --bs-table-hover-bg: var(--bg3); --bs-table-color: var(--text); }
    .table th {
      color: var(--text2);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-color: var(--border);
      background: var(--bg3) !important;
      font-weight: normal;
      padding: 7px 12px;
    }
    .table th.sortable-th { cursor: pointer; user-select: none; position: relative; }
    .table th.sortable-th::after {
      content: '↕';
      font-size: 10px;
      color: var(--text3);
      margin-left: 6px;
      opacity: 0.7;
    }
    .table th.sortable-th[data-sort-dir="asc"]::after { content: '▲'; color: var(--green); opacity: 1; }
    .table th.sortable-th[data-sort-dir="desc"]::after { content: '▼'; color: var(--green); opacity: 1; }
    .table td { border-color: var(--border); vertical-align: middle; padding: 7px 12px; background: var(--bg2) !important; color: var(--text); }
    .table tbody tr:hover td { background: var(--bg3) !important; }

    /* ── badges ── */
    .bid {
      display: inline-block;
      background: rgba(61,220,132,0.08);
      color: var(--green);
      border: 1px solid rgba(61,220,132,0.2);
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 2px;
      font-family: var(--font);
      letter-spacing: 0.5px;
    }
    .status-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 2px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .status-active   { background: rgba(61,220,132,0.1);  color: var(--green);  border: 1px solid rgba(61,220,132,0.2); }
    .status-paused   { background: rgba(240,165,0,0.1);   color: var(--amber);  border: 1px solid rgba(240,165,0,0.2); }
    .status-complete { background: rgba(74,158,255,0.1);  color: var(--blue);   border: 1px solid rgba(74,158,255,0.2); }

    /* ── forms ── */
    .form-control, .form-select {
      background: var(--bg3);
      border: 1px solid var(--border2);
      color: var(--text);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 12px;
      padding: 5px 10px;
    }
    .form-control:focus, .form-select:focus {
      background: var(--bg4);
      border-color: var(--green2);
      color: var(--text);
      box-shadow: 0 0 0 2px rgba(61,220,132,0.08);
    }
    .form-control::placeholder { color: var(--text3); }
    .form-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text2); margin-bottom: 4px; }

    /* ── buttons ── */
    .btn { font-family: var(--font); border-radius: var(--radius); font-size: 11px; letter-spacing: 0.5px; }
    .btn-primary {
      background: transparent;
      border: 1px solid var(--green2);
      color: var(--green);
    }
    .btn-primary:hover { background: var(--green-bg); border-color: var(--green); color: var(--green); }
    .btn-danger { background: transparent; border: 1px solid #5a2525; color: var(--red); }
    .btn-danger:hover { background: rgba(224,85,85,0.08); border-color: var(--red); color: var(--red); }
    .btn-sm { padding: 2px 9px; font-size: 10px; }
    .btn-xs { padding: 1px 6px; font-size: 9px; }

    /* ── stats ── */
    .stat-grid { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat {
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: var(--radius);
      min-width: 110px;
    }
    .stat .s-label { font-size: 9px; color: var(--text3); letter-spacing: 1.5px; text-transform: uppercase; }
    .stat .s-value { font-size: 26px; color: var(--green); font-weight: bold; line-height: 1.2; }
    .stat .s-sub { font-size: 10px; color: var(--text3); }

    /* ── box minimap ── */
    .box-map {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .box-tile {
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 2px;
      padding: 5px 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      text-decoration: none;
    }
    .box-tile:hover { border-color: var(--green2); background: var(--bg4); }
    .box-tile .bt-label { font-size: 10px; color: var(--green); font-weight: bold; }
    .box-tile .bt-model { font-size: 9px; color: var(--text3); }
    .box-tile .bt-bar {
      margin-top: 4px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .box-tile .bt-fill { height: 100%; background: var(--green2); border-radius: 2px; transition: width 0.3s; }
    .box-144 { width: 72px; }
    .box-96  { width: 58px; }
    .box-48  { width: 44px; }
    .box-24  { width: 32px; }

    /* ── event log ── */
    .eventlog-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 6px 16px 8px;
      z-index: 200;
    }
    .eventlog-label {
      font-size: 9px; color: var(--text3);
      letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 4px;
    }
    #event-log {
      height: 58px;
      overflow-y: auto;
      display: flex;
      flex-direction: column-reverse;
    }
    .log-line { font-size: 11px; color: var(--text3); line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .log-line .ts { color: var(--text3); margin-right: 10px; }
    .log-line.scan   { color: var(--green); }
    .log-line.stock  { color: var(--amber); }
    .log-line.error  { color: var(--red); }
    .log-line.info   { color: var(--blue); }

    /* ── todo ── */
    .todo-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
    .todo-item:last-child { border-bottom: none; }
    .todo-item.done .todo-text { text-decoration: line-through; color: var(--text3); }
    .priority-2 { border-left: 2px solid var(--red); padding-left: 6px; }
    .priority-1 { border-left: 2px solid var(--amber); padding-left: 6px; }

    /* ── misc ── */
    .sep { color: var(--text3); margin: 0 4px; }
    .muted { color: var(--text3); }
    .page-title { font-size: 13px; color: var(--text2); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="brand">LAB<span>::</span>INV</div>
  <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
  <a href="/components" class="nav-link {% if '/components' in request.url.path %}active{% endif %}">Components</a>
  <a href="/registry" class="nav-link {% if '/registry' in request.url.path %}active{% endif %}">Registry</a>
  <a href="/kits" class="nav-link {% if '/kits' in request.url.path %}active{% endif %}">Kits</a>
  <a href="/orders" class="nav-link {% if '/orders' in request.url.path %}active{% endif %}">Orders</a>
  <a href="/boxes" class="nav-link {% if '/boxes' in request.url.path %}active{% endif %}">Boxes</a>
  <a href="/projects" class="nav-link {% if '/projects' in request.url.path %}active{% endif %}">Projects</a>
  <a href="/labels/designer" class="nav-link {% if '/labels' in request.url.path %}active{% endif %}">Labels</a>
  <a href="/scan" class="nav-link {% if '/scan' in request.url.path %}active{% endif %}">Scan</a>
  <a href="/settings" class="nav-link {% if '/settings' in request.url.path %}active{% endif %}">Settings</a>
  <div class="topbar-right">
    <button onclick="openAddPopup()" class="btn btn-primary btn-sm" style="font-size:11px;padding:3px 10px;letter-spacing:1px;" title="Add component (A)">+ ADD</button>
    <div class="ws-dot" id="ws-dot" title="WebSocket"></div>
    <div class="profile-badge" title="{{ profile.name if profile else 'AP' }}">
      {{ profile.initials if profile else 'AP' }}
    </div>
  </div>
</div>

<div class="main">
  {% block content %}{% endblock %}
</div>

<div class="eventlog-bar">
  <div class="eventlog-label">event log</div>
  <div id="event-log"></div>
</div>

<script>
const log = document.getElementById('event-log');
const wsDot = document.getElementById('ws-dot');

function addLog(msg, cls='') {
  const ts = new Date().toTimeString().slice(0,8);
  const line = document.createElement('div');
  line.className = `log-line ${cls}`;
  line.innerHTML = `<span class="ts">${ts}</span>${msg}`;
  log.prepend(line);
  if (log.children.length > 80) log.removeChild(log.lastChild);
}

const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${wsProto}://${location.host}/ws`);
ws.onopen = () => { wsDot.classList.add('on'); addLog('ws connected', 'info'); };
ws.onclose = () => { wsDot.classList.remove('on'); addLog('ws disconnected', 'error'); };
ws.onmessage = (e) => {
  const msg = JSON.parse(e.data);
  if (msg.event === 'scan') {
    addLog(`SCAN ${msg.data.barcode_id} → ${msg.data.name} [${msg.data.box}:${msg.data.cell}]`, 'scan');
    document.dispatchEvent(new CustomEvent('inv:scan', {detail: msg.data}));
  } else if (msg.event === 'stock_change') {
    const s = msg.data.delta > 0 ? '+' : '';
    addLog(`STOCK ${msg.data.barcode_id} ${s}${msg.data.delta} → qty ${msg.data.quantity}`, 'stock');
  } else if (msg.event === 'component_created') {
    addLog(`NEW ${msg.data.barcode_id} ${msg.data.name}`, 'info');
  } else if (msg.event === 'project_created') {
    addLog(`PROJECT ${msg.data.name}`, 'info');
  }
};

// HID scanner global buffer
let buf = '', bufTimer;
document.addEventListener('keydown', (e) => {
  if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
  if (e.key === 'Enter' && buf.length > 2) {
    fetch('/api/components/' + buf.toUpperCase() + '/scan', {method:'POST'});
    buf = '';
  } else if (e.key.length === 1) {
    buf += e.key;
    clearTimeout(bufTimer);
    bufTimer = setTimeout(() => buf = '', 500);
  }
});

// Make non-semantic clickable elements keyboard accessible across pages.
document.addEventListener('DOMContentLoaded', () => {
  const clickable = Array.from(document.querySelectorAll('[onclick]')).filter(el => {
    const tag = (el.tagName || '').toUpperCase();
    return !['A', 'BUTTON', 'INPUT', 'SELECT', 'TEXTAREA', 'LABEL', 'SUMMARY'].includes(tag);
  });

  clickable.forEach(el => {
    if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
    if (!el.hasAttribute('role')) el.setAttribute('role', 'button');
    if (el.dataset.kbdBound === '1') return;
    el.dataset.kbdBound = '1';
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        el.click();
      }
    });
  });
});
</script>

{% include "add_popup.html" %}

<script>
// ── Add Popup ──────────────────────────────────────────────────────────────
let _types = [], _manufacturers = [], _typePaths = [], _formLoaded = false;

async function _loadFormData() {
  if (_formLoaded) return;
  try {
    const [t, m, tp] = await Promise.all([
      fetch('/api/components/types').then(r => r.ok ? r.json() : []),
      fetch('/api/manufacturers').then(r => r.ok ? r.json() : []),
      fetch('/api/components/type-paths').then(r => r.ok ? r.json() : {paths: []}),
    ]);
    _types = Array.isArray(t) ? t : [];
    _manufacturers = Array.isArray(m) ? m : [];
    _typePaths = Array.isArray(tp?.paths) ? tp.paths : [];

    const sel = document.getElementById('f-type');
    if (sel && _types.length) {
      _types.forEach(type => {
        if (!sel.querySelector(`option[value="${type.id}"]`)) {
          const opt = document.createElement('option');
          opt.value = type.id;
          opt.textContent = type.name;
          sel.appendChild(opt);
        }
      });
    }
    const dl = document.getElementById('mfr-list');
    if (dl && _manufacturers.length) {
      dl.innerHTML = '';
      _manufacturers.forEach(mfr => {
        const opt = document.createElement('option');
        opt.value = mfr.name;
        dl.appendChild(opt);
      });
    }

    const pathSel = document.getElementById('f-type-path');
    if (pathSel && _typePaths.length) {
      _typePaths.forEach(path => {
        if (!pathSel.querySelector(`option[value="${path}"]`)) {
          const opt = document.createElement('option');
          opt.value = path;
          opt.textContent = path;
          pathSel.appendChild(opt);
        }
      });
    }

    if (document.getElementById('kit-components-list')?.children.length === 0) {
      addKitRow();
    }
    _formLoaded = true;

    // Load available supplier sources and update dropdown
    fetch('/api/sources').then(r => r.ok ? r.json() : null).then(sources => {
      if (!sources) return;
      const sel = document.getElementById('lookup-source');
      if (!sel) return;
      // Clear and rebuild
      sel.innerHTML = '<option value="auto">Auto</option>';
      if (sources.digikey) sel.innerHTML += '<option value="digikey">DigiKey</option>';
      if (sources.mouser)  sel.innerHTML += '<option value="mouser">Mouser ✓</option>';
      sel.innerHTML += '<option value="digikey" disabled>─────</option>';
      // Status hint
      const hints = [];
      if (!sources.mouser) hints.push('Mouser: add MOUSER_API_KEY');
      if (!sources.gemini) hints.push('Gemini: add GEMINI_API_KEY');
      if (hints.length) {
        const hint = document.getElementById('lookup-source-hint');
        if (hint) hint.textContent = hints.join(' · ');
      }
    }).catch(() => {});

  } catch(e) {
    console.error('_loadFormData error:', e);
  }
}

function openAddPopup(e) {
  if (e && e.shiftKey) { window.open('/add', '_blank'); return; }
  document.getElementById('add-popup').style.display = 'flex';
  _loadFormData();
  setTimeout(() => { const el = document.getElementById('lookup-input'); if(el) el.focus(); }, 100);
}

function closeAddPopup() {
  document.getElementById('add-popup').style.display = 'none';
}

function toggleEntryMode() {
  const mode = document.getElementById('entry-type')?.value || 'single';
  const single = document.getElementById('single-entry-mode');
  const kit = document.getElementById('kit-entry-mode');
  if (single) single.style.display = mode === 'single' ? '' : 'none';
  if (kit) kit.style.display = mode === 'kit' ? '' : 'none';
}

async function onTypePathChanged() {
  const path = document.getElementById('f-type-path')?.value;
  const wrap = document.getElementById('type-fields-wrap');
  const hint = document.getElementById('f-type-fields-hint');
  const typeData = document.getElementById('f-type-data');
  if (!path) {
    if (wrap) wrap.style.display = 'none';
    return;
  }
  if (wrap) wrap.style.display = '';

  try {
    const r = await fetch('/api/components/type-fields?type_path=' + encodeURIComponent(path));
    if (!r.ok) return;
    const d = await r.json();
    const fields = d.fields || [];
    const required = d.required || [];
    const defaults = d.defaults || {};
    if (hint) {
      hint.textContent = 'Fields: ' + fields.join(', ') + (required.length ? ' | Required: ' + required.join(', ') : '');
    }
    if (typeData && Object.keys(defaults).length && !typeData.value.trim()) {
      typeData.value = JSON.stringify(defaults);
    }

    // Keep legacy type selector in sync.
    const parts = path.split('/').filter(Boolean);
    if (parts.length >= 2) {
      const typeName = parts[1];
      const match = _types.find(t => t.name === typeName);
      if (match) {
        const sel = document.getElementById('f-type');
        if (sel) sel.value = match.id;
      }
    }
  } catch (_) {
    // Non-critical metadata call.
  }
}

function _kitTypeOptionsHtml() {
  const paths = _typePaths.length ? _typePaths : [
    'passives/resistor/film', 'passives/capacitor/ceramic', 'passives/inductor/coil',
    'actives/diode/rectifier', 'actives/ic/microcontroller', 'modules/sensor/temperature'
  ];
  return paths.map(p => `<option value="${p}">${p}</option>`).join('');
}

function addKitRow(prefill = {}) {
  const list = document.getElementById('kit-components-list');
  if (!list) return;
  const row = document.createElement('div');
  row.style.display = 'grid';
  row.style.gridTemplateColumns = '2.5fr 2fr 0.8fr auto';
  row.style.gap = '6px';
  row.innerHTML = `
    <select class="form-select kit-type-path">${_kitTypeOptionsHtml()}</select>
    <input class="form-control kit-name" placeholder="Component name">
    <input class="form-control kit-qty" type="number" min="1" value="1">
    <button type="button" class="btn btn-danger btn-xs" onclick="removeKitRow(this)">×</button>
  `;
  list.appendChild(row);
  if (prefill.type_path) row.querySelector('.kit-type-path').value = prefill.type_path;
  if (prefill.name) row.querySelector('.kit-name').value = prefill.name;
  if (prefill.quantity) row.querySelector('.kit-qty').value = prefill.quantity;
}

function removeKitRow(btn) {
  const row = btn?.parentElement;
  if (row) row.remove();
}

async function saveKit() {
  const status = document.getElementById('kit-form-status');
  const name = document.getElementById('kit-name')?.value?.trim();
  const description = document.getElementById('kit-description')?.value?.trim();
  if (!name) {
    if (status) status.textContent = 'Kit name is required';
    return;
  }

  const rows = Array.from(document.querySelectorAll('#kit-components-list > div'));
  const components = rows.map(row => ({
    name: row.querySelector('.kit-name')?.value?.trim(),
    type_path: row.querySelector('.kit-type-path')?.value,
    quantity: parseInt(row.querySelector('.kit-qty')?.value || '1', 10),
  })).filter(c => c.name);

  if (!components.length) {
    if (status) status.textContent = 'Add at least one component row';
    return;
  }

  if (status) status.textContent = 'Saving kit...';
  try {
    const r = await fetch('/api/kits/', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name, description, components}),
    });
    if (!r.ok) {
      if (status) status.textContent = 'Save failed';
      return;
    }
    if (status) status.textContent = 'Kit saved';
    setTimeout(() => location.reload(), 500);
  } catch (e) {
    if (status) status.textContent = 'Network error';
  }
}

// wire unit select
document.addEventListener('DOMContentLoaded', () => {
  const sel = document.getElementById('f-unit-sel');
  const inp = document.getElementById('f-unit');
  if (!sel || !inp) return;
  sel.name = 'unit';
  sel.addEventListener('change', () => {
    if (sel.value === 'custom') {
      sel.name = '';
      inp.name = 'unit';
      inp.style.display = '';
      inp.focus();
    } else {
      inp.name = '';
      inp.style.display = 'none';
      sel.name = 'unit';
    }
  });
});

// Lookup
let _lookupTimer;
function debounceLookup(val) {
  clearTimeout(_lookupTimer);
  const res = document.getElementById('lookup-results');
  if (!val || val.length < 2) { if(res) res.style.display='none'; return; }
  _lookupTimer = setTimeout(() => runLookup(val), 450);
}

async function runLookup(q, force) {
  const sourceEl = document.getElementById('lookup-source');
  const source = sourceEl ? sourceEl.value : 'auto';
  const res = document.getElementById('lookup-results');
  if (!res) return;
  res.style.display = 'block';
  res.innerHTML = '<div style="padding:8px;color:var(--text3);font-size:11px;">' + (force ? 'Force refreshing…' : 'Searching…') + '</div>';
  try {
    const url = `/api/lookup/search?q=${encodeURIComponent(q)}&source=${source}` + (force ? '&force=true' : '');
    const data = await fetch(url).then(r=>r.json());
    const results = data.results || [];
    if (!results.length) {
      res.innerHTML = '<div style="padding:8px;color:var(--text3);font-size:11px;">No results — try DigiKey or LCSC directly</div>';
      return;
    }
    window._lookupResults = {};
    res.innerHTML = results.map((r, i) => {
      window._lookupResults[i] = r;
      const src = r.source || '?';
      const srcCls = src === 'digikey' ? 'lr-dk' : 'lr-lc';
      // Use MPN as primary name if name looks like a description (longer than ~30 chars and has spaces)
      const rawName = r.name || r.mpn || 'Unknown';
      const displayName = (rawName.length > 35 && rawName.includes(' ') && r.mpn) ? r.mpn : rawName;
      const name = displayName.replace(/</g,'&lt;');
      const mfrStr = (r.manufacturer || '').replace(/</g,'&lt;');
      const price = r.unit_price ? '$' + parseFloat(r.unit_price).toFixed(3) : '';
      const hc = r.high_confidence ? '<span style="color:var(--green);font-size:9px;margin-right:4px;">★</span>' : '';
      // Image — real or generic SVG icon
      const imgSrc = r.image_url || r.generic_icon || '';
      const imgEl = imgSrc ? '<img src="' + imgSrc + '" style="width:36px;height:36px;object-fit:contain;border-radius:2px;background:var(--bg3);flex-shrink:0;" onerror="this.style.display=\'none\'">' : '<div style="width:36px;height:36px;background:var(--bg3);border-radius:2px;flex-shrink:0;"></div>';
      return '<div class="lookup-result-item" onclick="selectLookupResult(' + i + ')" style="gap:8px;padding:6px 10px;">' +
        imgEl +
        '<div style="flex:1;min-width:0;">' +
        '<div style="display:flex;align-items:center;gap:4px;">' + hc +
        '<span style="font-size:11px;color:var(--text);font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + name + '</span>' +
        '</div>' +
        '<div style="font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + mfrStr + (r.package ? ' · ' + r.package : '') + '</div>' +
        '</div>' +
        '<div style="text-align:right;flex-shrink:0;">' +
        '<span class="lr-source ' + srcCls + '">' + src + '</span>' +
        (price ? '<div style="color:var(--amber);font-size:10px;margin-top:2px;">' + price + '</div>' : '') +
        '</div>' +
        '</div>';
    }).join('');
  } catch(e) {
    res.innerHTML = '<div style="padding:8px;color:var(--red);font-size:11px;">Lookup error — check console</div>';
    console.error('Lookup error:', e);
  }
}

function selectLookupResult(idx) {
  const r = window._lookupResults[idx] || {};
  if (!r) return;
  const set = (id, val) => { const el = document.getElementById(id); if(el && val) el.value = val; };
  // Use MPN as name if name is a long description
  const displayName = (r.name && r.name.length > 35 && r.name.includes(' ') && r.mpn) ? r.mpn : (r.name || r.mpn || '');
  set('f-name', displayName);
  set('f-mpn', r.mpn);
  set('f-dkpn', r.digikey_pn);
  set('f-lcsc', r.lcsc_pn);
  set('f-package', r.package);
  set('f-tolerance', r.tolerance);
  set('f-voltage', r.voltage_rating);
  set('f-datasheet', r.datasheet_url);
  set('f-mfr', r.manufacturer);
  set('f-value', r.value);
  set('f-imgurl', r.image_url);
  set('f-desc', r.description);
  if (r.type_path) {
    set('f-type-path', r.type_path);
    onTypePathChanged();
  }

  // auto-select type — local heuristic first, Gemini classify as fallback
  if (_types.length && r.name) {
    const nl = (r.name + ' ' + (r.description||'')).toLowerCase();
    const HINTS = {
      'resistor': ['resist','ohm','Ω'],
      'capacitor': ['cap ','ceram','electrolytic','tantalum','farad','mlcc'],
      'diode': ['diode','schottky','zener','tvs','rectifier'],
      'led': ['led','light emit'],
      'transistor': ['transistor','bjt','npn','pnp'],
      'mosfet': ['mosfet','nmos','pmos','nch','pch'],
      'ic': [' ic','chip','controller','mcu','amplifier','regulator','driver','esp32','stm32','atmega'],
      'inductor': ['inductor','inductance','ferrite','choke','coil'],
      'connector': ['connector','header','terminal','socket','plug'],
      'relay': ['relay'],
      'crystal': ['crystal','oscillator','resonator','xtal'],
      'module': ['module','board','breakout','devkit','dev kit'],
      'sensor': ['sensor','imu','accelerometer','gyro'],
    };
    let matched = null;
    for (const [type, keywords] of Object.entries(HINTS)) {
      if (keywords.some(k => nl.includes(k.toLowerCase()))) { matched = type; break; }
    }
    if (matched) {
      const t = _types.find(t => t.name === matched);
      if (t) { const sel = document.getElementById('f-type'); if(sel) sel.value = t.id; }
    } else if (r.name && r.name.length > 3) {
      // fallback to Gemini classify
      fetch('/api/ai/classify', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({text: r.name + ' ' + (r.description||'')})
      }).then(res => res.ok ? res.json() : null).then(cls => {
        if (!cls || cls.confidence < 0.6) return;
        const t = _types.find(t => t.name === cls.type);
        if (t) { const sel = document.getElementById('f-type'); if(sel) sel.value = t.id; }
      }).catch(()=>{});
    }
  }

  const prevName = document.getElementById('preview-name');
  const prevMPN = document.getElementById('preview-mpn');
  const prevDesc = document.getElementById('preview-desc');
  const prevPrice = document.getElementById('preview-price');
  const prevSrc = document.getElementById('preview-source');
  const prevImg = document.getElementById('preview-img');
  const prevBox = document.getElementById('lookup-preview');

  if(prevName) prevName.textContent = r.name || '';
  if(prevMPN) prevMPN.textContent = [r.mpn, r.digikey_pn, r.lcsc_pn].filter(Boolean).join(' · ');
  if(prevDesc) prevDesc.textContent = r.description || '';
  if(prevPrice) prevPrice.textContent = r.unit_price ? `$${parseFloat(r.unit_price).toFixed(4)}` : '';
  if(prevSrc) prevSrc.textContent = r.source || '';
  if(prevImg && r.image_url) { prevImg.src = r.image_url; prevImg.style.display=''; }
  if(prevBox) prevBox.style.display = 'block';

  const res = document.getElementById('lookup-results');
  if(res) res.style.display = 'none';
  const inp = document.getElementById('lookup-input');
  if(inp) inp.value = '';
}

function clearPreview() {
  const p = document.getElementById('lookup-preview');
  if(p) p.style.display='none';
  const i = document.getElementById('f-imgurl');
  if(i) i.value='';
}

async function _doSubmit(keepOpen) {
  const btn = document.getElementById(keepOpen ? 'add-another-btn' : 'add-submit-btn');
  const status = document.getElementById('add-form-status');
  if(btn) { btn.disabled=true; btn.textContent='Saving...'; }
  const fd = new FormData(document.getElementById('add-comp-form'));
  try {
    const r = await fetch('/api/components/', {method:'POST', body: fd});
    const txt = await r.text();
    if (r.ok) {
      const data = JSON.parse(txt);
      let msg = `✓ ${data.barcode_id} saved`;
      if(status) { status.style.color='var(--green)'; status.textContent=msg; }
      resetAddForm();
      if (!keepOpen) {
        closeAddPopup();
        // If on components page, reload to show new entry with image
        if (window.location.pathname.startsWith('/components') ||
            window.location.pathname === '/') location.reload();
      }
    } else {
      if(status) { status.style.color='var(--red)'; status.textContent=`Error: ${txt.slice(0,100)}`; }
    }
  } catch(e) {
    if(status) { status.style.color='var(--red)'; status.textContent=`Network error`; }
  }
  if(btn) { btn.disabled=false; btn.textContent = keepOpen ? '+ Add Another' : 'Save'; }
}

function submitAddForm(e) { e.preventDefault(); _doSubmit(false); }
function addAnother() { _doSubmit(true); }

function resetAddForm() {
  const form = document.getElementById('add-comp-form');
  if(form) form.reset();
  clearPreview();
  const res = document.getElementById('lookup-results');
  if(res) res.style.display='none';
  const wrap = document.getElementById('type-fields-wrap');
  if (wrap) wrap.style.display = 'none';
}


async function runAIParse() {
  const txt = document.getElementById('ai-paste-input')?.value?.trim();
  const status = document.getElementById('ai-parse-status');
  if (!txt || txt.length < 5) { if(status) status.textContent = 'Paste some text first'; return; }
  if(status) status.textContent = 'Parsing…';
  try {
    const r = await fetch('/api/ai/parse', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: txt}),
    });
    if (!r.ok) { if(status) status.textContent = 'Parse failed'; return; }
    const d = await r.json();
    const set = (id, val) => { const el = document.getElementById(id); if(el && val && val !== 'null') el.value = val; };

    if (d.is_kit) {
      const mode = document.getElementById('entry-type');
      if (mode) mode.value = 'kit';
      toggleEntryMode();
      set('kit-name', d.name);
      set('kit-description', d.description);
      const container = document.getElementById('kit-components-list');
      if (container) container.innerHTML = '';
      (d.kit_components || []).forEach(item => addKitRow(item));
      if(status) status.textContent = '✓ Parsed kit';
      return;
    }

    set('f-name', d.name);
    set('f-mpn', d.mpn);
    set('f-value', d.value);
    set('f-package', d.package);
    set('f-tolerance', d.tolerance);
    set('f-mfr', d.manufacturer);
    set('f-datasheet', d.datasheet_url);
    set('f-imgurl', d.image_url);
    set('f-type-path', d.type_path);
    if (d.type_data) {
      const td = document.getElementById('f-type-data');
      if (td) td.value = JSON.stringify(d.type_data);
    }
    if (d.type_path) onTypePathChanged();
    if(d.voltage_rating) set('f-voltage', d.voltage_rating);
    // auto-select type
    if (d.type && _types.length) {
      const match = _types.find(t => t.name === d.type);
      if (match) { const sel = document.getElementById('f-type'); if(sel) sel.value = match.id; }
    }
    if(status) status.textContent = '✓ Fields filled (' + (d.source||'') + ')';
    if(d.image_url) {
      set('f-imgurl', d.image_url);
      const pi = document.getElementById('preview-img');
      if(pi) { pi.src = d.image_url; pi.style.display=''; }
      const pb = document.getElementById('lookup-preview');
      if(pb) pb.style.display='block';
    }
    setTimeout(() => { if(status) status.textContent=''; }, 4000);
  } catch(e) {
    if(status) status.textContent = 'Error: ' + e.message;
  }
}

// keyboard: A = open, Escape = close
document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  if (tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT') return;
  if (e.key==='a'||e.key==='A') openAddPopup(e);
  if (e.key==='Escape') closeAddPopup();
});
</script>

<script>
// ── Global Smart Table Sorting ────────────────────────────────────────────
(function () {
  const RELATION_WEIGHT = {
    '<': -0.4,
    '<=': -0.2,
    '=': 0,
    '~': 0,
    '>=': 0.2,
    '>': 0.4,
  };

  const PREFIX_FACTORS = {
    p: 1e-12,
    n: 1e-9,
    u: 1e-6,
    m: 1e-3,
    k: 1e3,
    K: 1e3,
    M: 1e6,
    G: 1e9,
    T: 1e12,
  };

  function normalizeRawText(s) {
    return (s || '')
      .replace(/\u00a0/g, ' ')
      .replace(/[\u2000-\u200b]/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function canonicalUnit(raw) {
    if (!raw) return { family: 'scalar', factor: 1 };
    const u = raw
      .replace(/[Ωω]/g, 'ohm')
      .replace(/°/g, '')
      .trim();
    const low = u.toLowerCase();

    const map = {
      // Mass
      g: ['mass', 1],
      kg: ['mass', 1e3],
      mg: ['mass', 1e-3],
      lb: ['mass', 453.59237],
      oz: ['mass', 28.349523125],

      // Data size
      b: ['bytes', 1],
      kb: ['bytes', 1024],
      mb: ['bytes', 1024 ** 2],
      gb: ['bytes', 1024 ** 3],
      tb: ['bytes', 1024 ** 4],

      // Time
      s: ['time', 1],
      sec: ['time', 1],
      ms: ['time', 1e-3],
      min: ['time', 60],
      hr: ['time', 3600],
      day: ['time', 86400],
      mo: ['time', 2629800],
      yr: ['time', 31557600],

      // Electrical
      v: ['voltage', 1],
      a: ['current', 1],
      w: ['power', 1],
      ohm: ['resistance', 1],
      f: ['capacitance', 1],
      h: ['inductance', 1],
      hz: ['frequency', 1],
      wh: ['energy_wh', 1],
      ah: ['charge_ah', 1],
    };

    if (map[low]) return { family: map[low][0], factor: map[low][1] };

    // SI-prefixed electrical/frequency/energy/charge units (kHz, mAh, uF, etc.)
    if (u.length >= 2) {
      const p = u[0];
      const rest = u.slice(1).toLowerCase();
      if (PREFIX_FACTORS[p] !== undefined && map[rest]) {
        return {
          family: map[rest][0],
          factor: map[rest][1] * PREFIX_FACTORS[p],
        };
      }
    }

    return { family: low, factor: 1 };
  }

  function parseScalar(raw) {
    let s = normalizeRawText(raw);
    if (!s) return null;

    let relation = '=';
    const rel = s.match(/^(<=|>=|<|>|=|~)\s*/);
    if (rel) {
      relation = rel[1];
      s = s.slice(rel[0].length).trim();
    }

    // Fraction like 1/4W
    const frac = s.match(/^([+-]?\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)(.*)$/);
    if (frac) {
      const n = parseFloat(frac[1]);
      const d = parseFloat(frac[2]);
      if (Number.isFinite(n) && Number.isFinite(d) && d !== 0) {
        s = `${n / d}${frac[3] || ''}`;
      }
    }

    const numMatch = s.match(/^([+-]?(?:\d[\d,]*\.?\d*|\.\d+))(.*)$/);
    if (!numMatch) return null;

    let value = parseFloat(numMatch[1].replace(/,/g, ''));
    if (!Number.isFinite(value)) return null;

    let rest = (numMatch[2] || '').trim();
    if (rest) {
      // Quantifier prefix attached directly (10k, 3M, 100uF).
      const maybePrefix = rest[0];
      if (PREFIX_FACTORS[maybePrefix] !== undefined) {
        value *= PREFIX_FACTORS[maybePrefix];
        rest = rest.slice(1);
      }
    }

    const unit = canonicalUnit(rest);
    const adjusted = (value * unit.factor) + (RELATION_WEIGHT[relation] || 0);
    return { kind: 'num', value: adjusted, family: unit.family };
  }

  function parseSmartValue(raw) {
    const text = normalizeRawText(raw);
    if (!text) return { kind: 'text', text: '' };

    // Date handling
    const ts = Date.parse(text);
    if (!Number.isNaN(ts) && /\d{4}|\d{1,2}[\/\-]\d{1,2}/.test(text)) {
      return { kind: 'num', value: ts, family: 'date' };
    }

    // Range handling: 10-20V => midpoint
    const range = text.match(/^(.+?)\s*[-–]\s*(.+)$/);
    if (range) {
      const left = parseScalar(range[1]);
      const right = parseScalar(range[2]);
      if (left && right && left.family === right.family) {
        return { kind: 'num', value: (left.value + right.value) / 2, family: left.family };
      }
    }

    // Rate handling: 10MB/s, 2Ah/yr, /hr
    const rate = text.match(/^(.*?)\s*\/\s*([a-zA-ZµμΩω]+)$/);
    if (rate) {
      const leftRaw = normalizeRawText(rate[1]);
      const denomRaw = normalizeRawText(rate[2]);
      const left = leftRaw ? parseScalar(leftRaw) : { kind: 'num', value: 1, family: 'scalar' };
      const denom = parseScalar(`1${denomRaw}`);
      if (left && denom && denom.value !== 0) {
        return {
          kind: 'num',
          value: left.value / denom.value,
          family: `${left.family}_per_${denom.family}`,
        };
      }
    }

    const scalar = parseScalar(text);
    if (scalar) return scalar;

    return { kind: 'text', text: text.toLowerCase() };
  }

  function compareSmart(a, b) {
    if (a.kind === 'num' && b.kind === 'num') {
      if (a.family === b.family) {
        return a.value - b.value;
      }
      return a.family.localeCompare(b.family) || (a.value - b.value);
    }
    if (a.kind === 'num') return -1;
    if (b.kind === 'num') return 1;
    return a.text.localeCompare(b.text, undefined, { numeric: true, sensitivity: 'base' });
  }

  function sortTableByColumn(table, colIdx, th) {
    const tbody = table.tBodies && table.tBodies[0];
    if (!tbody) return;

    const rows = Array.from(tbody.rows);
    if (!rows.length) return;

    const state = table._sortState || { idx: -1, dir: 'asc' };
    let dir = 'asc';
    if (state.idx === colIdx) {
      dir = state.dir === 'asc' ? 'desc' : 'asc';
    }
    table._sortState = { idx: colIdx, dir };

    const indexed = rows.map((r, i) => {
      const cell = r.cells[colIdx];
      const raw = normalizeRawText(cell ? cell.textContent : '');
      return { r, i, k: parseSmartValue(raw) };
    });

    indexed.sort((x, y) => {
      const c = compareSmart(x.k, y.k);
      if (c !== 0) return dir === 'asc' ? c : -c;
      return x.i - y.i;
    });

    indexed.forEach(x => tbody.appendChild(x.r));

    table.querySelectorAll('thead th.sortable-th').forEach(h => h.removeAttribute('data-sort-dir'));
    th.setAttribute('data-sort-dir', dir);
  }

  function initSortableTables() {
    document.querySelectorAll('table').forEach(table => {
      const thead = table.tHead;
      const tbody = table.tBodies && table.tBodies[0];
      if (!thead || !tbody) return;
      const ths = Array.from(thead.querySelectorAll('th'));
      if (!ths.length) return;

      ths.forEach((th, idx) => {
        const plain = normalizeRawText(th.textContent || '');
        const hasControl = !!th.querySelector('input,button,select');
        if (!plain || hasControl) return;
        th.classList.add('sortable-th');
        th.addEventListener('click', () => sortTableByColumn(table, idx, th));
      });
    });
  }

  document.addEventListener('DOMContentLoaded', initSortableTables);
})();
</script>
