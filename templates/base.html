<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LAB::INV{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    :root {
      --bg:       #0a0a0a;
      --bg2:      #111111;
      --bg3:      #181818;
      --bg4:      #1e1e1e;
      --border:   #242424;
      --border2:  #2e2e2e;
      --green:    #3ddc84;
      --green2:   #2ab56d;
      --green-bg: rgba(61,220,132,0.06);
      --amber:    #f0a500;
      --red:      #e05555;
      --blue:     #4a9eff;
      --text:     #d4d4d4;
      --text2:    #888;
      --text3:    #555;
      --font:     'Courier New', Courier, monospace;
      --radius:   3px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    a { color: var(--green2); text-decoration: none; }
    a:hover { color: var(--green); }
    ::selection { background: rgba(61,220,132,0.2); }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg2); }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* ── topbar ── */
    .topbar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 42px;
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar .brand {
      color: var(--green);
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 3px;
      margin-right: 24px;
      white-space: nowrap;
    }
    .topbar .brand span { color: var(--text3); }
    .nav-link {
      color: var(--text3);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 0 12px;
      height: 42px;
      display: flex;
      align-items: center;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
    }
    .nav-link:hover { color: var(--text); border-bottom-color: var(--border2); }
    .nav-link.active { color: var(--green); border-bottom-color: var(--green); }
    .topbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ws-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--text3);
      transition: background 0.3s;
    }
    .ws-dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .profile-badge {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--bg4);
      border: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      font-weight: bold;
      color: var(--green);
      letter-spacing: 0.5px;
      cursor: default;
      user-select: none;
    }

    /* ── main ── */
    .main {
      padding: 20px 20px 140px;
      flex: 1;
    }

    /* ── cards ── */
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }
    .card-header {
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
      padding: 7px 14px;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text2);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-header .dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--green);
    }

    /* ── tables ── */
    .table { color: var(--text); font-size: 12px; margin: 0; }
    .table th {
      color: var(--text3);
      font-size: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-color: var(--border);
      background: var(--bg3);
      font-weight: normal;
      padding: 6px 12px;
    }
    .table td { border-color: var(--border); vertical-align: middle; padding: 6px 12px; }
    .table tbody tr:hover { background: var(--bg3); }

    /* ── badges ── */
    .bid {
      display: inline-block;
      background: rgba(61,220,132,0.08);
      color: var(--green);
      border: 1px solid rgba(61,220,132,0.2);
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 2px;
      font-family: var(--font);
      letter-spacing: 0.5px;
    }
    .status-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 2px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .status-active   { background: rgba(61,220,132,0.1);  color: var(--green);  border: 1px solid rgba(61,220,132,0.2); }
    .status-paused   { background: rgba(240,165,0,0.1);   color: var(--amber);  border: 1px solid rgba(240,165,0,0.2); }
    .status-complete { background: rgba(74,158,255,0.1);  color: var(--blue);   border: 1px solid rgba(74,158,255,0.2); }

    /* ── forms ── */
    .form-control, .form-select {
      background: var(--bg3);
      border: 1px solid var(--border2);
      color: var(--text);
      border-radius: var(--radius);
      font-family: var(--font);
      font-size: 12px;
      padding: 5px 10px;
    }
    .form-control:focus, .form-select:focus {
      background: var(--bg4);
      border-color: var(--green2);
      color: var(--text);
      box-shadow: 0 0 0 2px rgba(61,220,132,0.08);
    }
    .form-control::placeholder { color: var(--text3); }
    .form-label { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--text2); margin-bottom: 4px; }

    /* ── buttons ── */
    .btn { font-family: var(--font); border-radius: var(--radius); font-size: 11px; letter-spacing: 0.5px; }
    .btn-primary {
      background: transparent;
      border: 1px solid var(--green2);
      color: var(--green);
    }
    .btn-primary:hover { background: var(--green-bg); border-color: var(--green); color: var(--green); }
    .btn-danger { background: transparent; border: 1px solid #5a2525; color: var(--red); }
    .btn-danger:hover { background: rgba(224,85,85,0.08); border-color: var(--red); color: var(--red); }
    .btn-sm { padding: 2px 9px; font-size: 10px; }
    .btn-xs { padding: 1px 6px; font-size: 9px; }

    /* ── stats ── */
    .stat-grid { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    .stat {
      background: var(--bg2);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: var(--radius);
      min-width: 110px;
    }
    .stat .s-label { font-size: 9px; color: var(--text3); letter-spacing: 1.5px; text-transform: uppercase; }
    .stat .s-value { font-size: 26px; color: var(--green); font-weight: bold; line-height: 1.2; }
    .stat .s-sub { font-size: 10px; color: var(--text3); }

    /* ── box minimap ── */
    .box-map {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: flex-end;
    }
    .box-tile {
      background: var(--bg3);
      border: 1px solid var(--border2);
      border-radius: 2px;
      padding: 5px 8px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      text-decoration: none;
    }
    .box-tile:hover { border-color: var(--green2); background: var(--bg4); }
    .box-tile .bt-label { font-size: 10px; color: var(--green); font-weight: bold; }
    .box-tile .bt-model { font-size: 9px; color: var(--text3); }
    .box-tile .bt-bar {
      margin-top: 4px;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }
    .box-tile .bt-fill { height: 100%; background: var(--green2); border-radius: 2px; transition: width 0.3s; }
    .box-144 { width: 72px; }
    .box-96  { width: 58px; }
    .box-48  { width: 44px; }
    .box-24  { width: 32px; }

    /* ── event log ── */
    .eventlog-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--bg2);
      border-top: 1px solid var(--border);
      padding: 6px 16px 8px;
      z-index: 200;
    }
    .eventlog-label {
      font-size: 9px; color: var(--text3);
      letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 4px;
    }
    #event-log {
      height: 58px;
      overflow-y: auto;
      display: flex;
      flex-direction: column-reverse;
    }
    .log-line { font-size: 11px; color: var(--text3); line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .log-line .ts { color: var(--text3); margin-right: 10px; }
    .log-line.scan   { color: var(--green); }
    .log-line.stock  { color: var(--amber); }
    .log-line.error  { color: var(--red); }
    .log-line.info   { color: var(--blue); }

    /* ── todo ── */
    .todo-item { display: flex; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--border); }
    .todo-item:last-child { border-bottom: none; }
    .todo-item.done .todo-text { text-decoration: line-through; color: var(--text3); }
    .priority-2 { border-left: 2px solid var(--red); padding-left: 6px; }
    .priority-1 { border-left: 2px solid var(--amber); padding-left: 6px; }

    /* ── misc ── */
    .sep { color: var(--text3); margin: 0 4px; }
    .muted { color: var(--text3); }
    .page-title { font-size: 13px; color: var(--text2); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 16px; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="brand">LAB<span>::</span>INV</div>
  <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">Dashboard</a>
  <a href="/components" class="nav-link {% if '/components' in request.url.path %}active{% endif %}">Components</a>
  <a href="/boxes" class="nav-link {% if '/boxes' in request.url.path %}active{% endif %}">Boxes</a>
  <a href="/projects" class="nav-link {% if '/projects' in request.url.path %}active{% endif %}">Projects</a>
  <a href="/scan" class="nav-link {% if '/scan' in request.url.path %}active{% endif %}">Scan</a>
  <a href="/settings" class="nav-link {% if '/settings' in request.url.path %}active{% endif %}">Settings</a>
  <div class="topbar-right">
    <button onclick="openAddPopup()" class="btn btn-primary btn-sm" style="font-size:11px;padding:3px 10px;letter-spacing:1px;" title="Add component (A)">+ ADD</button>
    <div class="ws-dot" id="ws-dot" title="WebSocket"></div>
    <div class="profile-badge" title="{{ profile.name if profile else 'AP' }}">
      {{ profile.initials if profile else 'AP' }}
    </div>
  </div>
</div>

<div class="main">
  {% block content %}{% endblock %}
</div>

<div class="eventlog-bar">
  <div class="eventlog-label">event log</div>
  <div id="event-log"></div>
</div>

<script>
const log = document.getElementById('event-log');
const wsDot = document.getElementById('ws-dot');

function addLog(msg, cls='') {
  const ts = new Date().toTimeString().slice(0,8);
  const line = document.createElement('div');
  line.className = `log-line ${cls}`;
  line.innerHTML = `<span class="ts">${ts}</span>${msg}`;
  log.prepend(line);
  if (log.children.length > 80) log.removeChild(log.lastChild);
}

const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(`${wsProto}://${location.host}/ws`);
ws.onopen = () => { wsDot.classList.add('on'); addLog('ws connected', 'info'); };
ws.onclose = () => { wsDot.classList.remove('on'); addLog('ws disconnected', 'error'); };
ws.onmessage = (e) => {
  const msg = JSON.parse(e.data);
  if (msg.event === 'scan') {
    addLog(`SCAN ${msg.data.barcode_id} → ${msg.data.name} [${msg.data.box}:${msg.data.cell}]`, 'scan');
    document.dispatchEvent(new CustomEvent('inv:scan', {detail: msg.data}));
  } else if (msg.event === 'stock_change') {
    const s = msg.data.delta > 0 ? '+' : '';
    addLog(`STOCK ${msg.data.barcode_id} ${s}${msg.data.delta} → qty ${msg.data.quantity}`, 'stock');
  } else if (msg.event === 'component_created') {
    addLog(`NEW ${msg.data.barcode_id} ${msg.data.name}`, 'info');
  } else if (msg.event === 'project_created') {
    addLog(`PROJECT ${msg.data.name}`, 'info');
  }
};

// HID scanner global buffer
let buf = '', bufTimer;
document.addEventListener('keydown', (e) => {
  if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') return;
  if (e.key === 'Enter' && buf.length > 2) {
    fetch('/api/components/' + buf.toUpperCase() + '/scan', {method:'POST'});
    buf = '';
  } else if (e.key.length === 1) {
    buf += e.key;
    clearTimeout(bufTimer);
    bufTimer = setTimeout(() => buf = '', 500);
  }
});
</script>

{% include "add_popup.html" %}

{% block scripts %}{% endblock %}

<script>
// ── Add Popup ──────────────────────────────────────────────────────────────
let _types = [], _manufacturers = [];

async function _loadFormData() {
  if (_types.length) return;
  const [t, m] = await Promise.all([
    fetch('/api/components/types').then(r=>r.json()).catch(()=>[]),
    fetch('/api/manufacturers').then(r=>r.json()).catch(()=>[]),
  ]);
  _types = t;
  _manufacturers = m;
  const sel = document.getElementById('f-type');
  if (sel) {
    _types.forEach(type => {
      const opt = document.createElement('option');
      opt.value = type.id; opt.textContent = type.name;
      sel.appendChild(opt);
    });
  }
  const dl = document.getElementById('mfr-list');
  if (dl) {
    _manufacturers.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.name; dl.appendChild(opt);
    });
  }
}

function openAddPopup(e) {
  if (e && e.shiftKey) { window.open('/add', '_blank'); return; }
  document.getElementById('add-popup').style.display = 'flex';
  _loadFormData();
  setTimeout(() => document.getElementById('lookup-input').focus(), 100);
}

function closeAddPopup() {
  document.getElementById('add-popup').style.display = 'none';
}

function unitSelChange(sel) {
  const inp = document.getElementById('f-unit');
  const hidden = document.querySelector('[name=unit]');
  if (sel.value === 'custom') {
    inp.style.display = ''; inp.focus();
    if (hidden) hidden.value = '';
  } else {
    inp.style.display = 'none';
    if (hidden) hidden.value = sel.value;
    // set the actual name field value
    const nameInput = document.querySelector('input[name=unit]');
    if (!nameInput) {
      // unit is the select value
    }
  }
}

// wire unit select to hidden input
document.addEventListener('DOMContentLoaded', () => {
  const sel = document.getElementById('f-unit-sel');
  const inp = document.getElementById('f-unit');
  if (sel && inp) {
    sel.addEventListener('change', () => {
      if (sel.value !== 'custom') {
        inp.name = '';
        inp.style.display = 'none';
        sel.name = 'unit';
      } else {
        sel.name = '';
        inp.name = 'unit';
        inp.style.display = '';
      }
    });
    sel.name = 'unit';
  }
});

// Lookup debounce
let _lookupTimer;
function debounceLookup(val) {
  clearTimeout(_lookupTimer);
  if (val.length < 2) { document.getElementById('lookup-results').style.display='none'; return; }
  _lookupTimer = setTimeout(() => runLookup(val), 400);
}

async function runLookup(q) {
  const source = document.getElementById('lookup-source').value;
  const res = document.getElementById('lookup-results');
  res.style.display = 'block';
  res.innerHTML = '<div style="padding:8px;color:var(--text3);font-size:11px;">Searching...</div>';
  const data = await fetch(`/api/lookup/search?q=${encodeURIComponent(q)}&source=${source}`).then(r=>r.json()).catch(()=>({results:[]}));
  if (!data.results.length) {
    res.innerHTML = '<div style="padding:8px;color:var(--text3);font-size:11px;">No results</div>'; return;
  }
  res.innerHTML = data.results.map(r => `
    <div class="lookup-result-item" onclick='selectLookupResult(${JSON.stringify(r)})'>
      <span class="lr-source ${r.source==="digikey"?"lr-dk":"lr-lc"}">${r.source}</span>
      <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${r.name}</span>
      <span style="color:var(--text3);font-size:10px;white-space:nowrap;">${r.mpn||''}</span>
      ${r.unit_price ? `<span style="color:var(--amber);font-size:10px;">$${parseFloat(r.unit_price).toFixed(3)}</span>` : ''}
    </div>
  `).join('');
}

function selectLookupResult(r) {
  // fill form fields
  if (r.name) document.getElementById('f-name').value = r.name;
  if (r.mpn) document.getElementById('f-mpn').value = r.mpn;
  if (r.digikey_pn) document.getElementById('f-dkpn').value = r.digikey_pn;
  if (r.lcsc_pn) document.getElementById('f-lcsc').value = r.lcsc_pn;
  if (r.package) document.getElementById('f-package').value = r.package;
  if (r.tolerance) document.getElementById('f-tolerance').value = r.tolerance;
  if (r.voltage_rating) document.getElementById('f-voltage').value = r.voltage_rating;
  if (r.datasheet_url) document.getElementById('f-datasheet').value = r.datasheet_url;
  if (r.manufacturer) document.getElementById('f-mfr').value = r.manufacturer;
  if (r.value) document.getElementById('f-value').value = r.value;
  if (r.image_url) document.getElementById('f-imgurl').value = r.image_url;

  // show preview
  document.getElementById('preview-name').textContent = r.name || '';
  document.getElementById('preview-mpn').textContent = [r.mpn, r.digikey_pn, r.lcsc_pn].filter(Boolean).join(' · ');
  document.getElementById('preview-desc').textContent = r.description || '';
  document.getElementById('preview-price').textContent = r.unit_price ? `$${parseFloat(r.unit_price).toFixed(4)}` : '';
  document.getElementById('preview-source').textContent = r.source || '';
  if (r.image_url) {
    document.getElementById('preview-img').src = r.image_url;
    document.getElementById('preview-img').style.display = '';
  }
  document.getElementById('lookup-preview').style.display = 'block';
  document.getElementById('lookup-results').style.display = 'none';
  document.getElementById('lookup-input').value = '';
}

function clearPreview() {
  document.getElementById('lookup-preview').style.display = 'none';
  document.getElementById('f-imgurl').value = '';
}

async function submitAddForm(e) {
  e.preventDefault();
  const btn = document.getElementById('add-submit-btn');
  const status = document.getElementById('add-form-status');
  btn.disabled = true; btn.textContent = 'Saving...';
  const fd = new FormData(document.getElementById('add-comp-form'));
  const r = await fetch('/api/components/', {method:'POST', body: fd});
  if (r.ok) {
    const data = await r.json();
    status.style.color = 'var(--green)';
    status.textContent = `✓ Created ${data.barcode_id}`;
    resetAddForm();
    btn.disabled = false; btn.textContent = 'ADD COMPONENT';
    // if on components page, reload table
    if (window.location.pathname === '/components') location.reload();
  } else {
    const err = await r.text();
    status.style.color = 'var(--red)';
    status.textContent = `Error: ${err.slice(0,80)}`;
    btn.disabled = false; btn.textContent = 'ADD COMPONENT';
  }
}

function resetAddForm() {
  document.getElementById('add-comp-form').reset();
  clearPreview();
  document.getElementById('lookup-results').style.display = 'none';
  document.getElementById('add-form-status').textContent = '';
}

// keyboard shortcut: A to open add popup
document.addEventListener('keydown', e => {
  if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'SELECT') return;
  if (e.key === 'a' || e.key === 'A') openAddPopup();
  if (e.key === 'Escape') closeAddPopup();
});
</script>
</body>
</html>
