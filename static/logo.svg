<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#0a0a0a" stroke="#3ddc84" stroke-width="2"/>
  
  <!-- Hexagon (lab/technical) -->
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3ddc84;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1ba856;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main hexagon -->
  <polygon points="100,40 150,70 150,130 100,160 50,130 50,70" fill="none" stroke="url(#greenGrad)" stroke-width="2.5"/>
  
  <!-- Inner inventory icon (stacked boxes) -->
  <g transform="translate(100, 95)">
    <!-- Top box -->
    <rect x="-20" y="-24" width="40" height="16" fill="none" stroke="#3ddc84" stroke-width="2"/>
    <!-- Middle box (slightly offset) -->
    <rect x="-20" y="-6" width="40" height="16" fill="none" stroke="#3ddc84" stroke-width="2" opacity="0.8"/>
    <!-- Bottom box (slightly offset) -->
    <rect x="-20" y="12" width="40" height="16" fill="none" stroke="#3ddc84" stroke-width="2" opacity="0.6"/>
    
    <!-- Connecting lines (inventory flow) -->
    <line x1="0" y1="-24" x2="0" y2="28" stroke="#3ddc84" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- Corner accent dots -->
  <circle cx="160" cy="40" r="3" fill="#3ddc84"/>
  <circle cx="160" cy="160" r="3" fill="#3ddc84"/>
  <circle cx="40" cy="40" r="3" fill="#3ddc84"/>
  <circle cx="40" cy="160" r="3" fill="#3ddc84"/>
</svg>
